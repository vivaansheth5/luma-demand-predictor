[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luma-agent"
version = "0.1.0"
description = "Luma: an autonomous demand forecasting, trend detection and inventory agent for fashion brands."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vivaan Sheth" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "lightgbm>=4.3",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
api = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8",
  "ruff==0.16.9",
  "httpx>=0.27",
  "pyarrow>=15",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.scripts]
luma = "luma.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/luma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::UserWarning:lightgbm",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E741", "B008", "SIM108"]
